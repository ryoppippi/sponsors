name: sponsorkit

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  actions: read

jobs:
  update-sponsors:
    name: Update sponsors
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: x-ryoppippi/setup-nix@7f7ff26554cbbf09c1ce4f3369ca8fd2120a42d1
        with:
          github-token: ${{ github.token }}

      - name: Update sponsors
        run: nix run
        env:
          SPONSORKIT_GITHUB_TOKEN: ${{ secrets.SPONSORKIT_GITHUB_TOKEN }}

      - name: If changed, commit and push
        run: |
          git config user.name 'ryoppippi'
          git config user.email '1560508+ryoppippi@users.noreply.github.com'
          git add . && git commit -m 'chore: update sponsors' || echo 'No changes to commit'
          git push origin main
